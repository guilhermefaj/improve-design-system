name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  contracts-and-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  consumer-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vite, next]
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: node scripts/test-consumer-fixture.mjs --framework ${{ matrix.framework }} --react ${{ matrix.react }}

  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [contracts-and-components, consumer-fixtures, visual-regression]
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        run: |
          mkdir release-assets
          cp design-system.manifest.json llms.txt llms-full.txt release-assets/
          cp docs/MIGRATION_V0.5.md docs/MIGRATION_V0.6.md docs/MIGRATION_V1.0.md release-assets/
          tar -czf release-assets/improve-design-system-skill.tar.gz skills/improve-design-system
          tar -czf release-assets/improve-artifact-starters.tar.gz packages/artifact-kit/starters recipes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes
