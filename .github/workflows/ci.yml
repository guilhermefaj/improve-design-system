name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'

# Least-privilege default token: these jobs only read the repo and upload
# build artifacts, so no write scopes are needed.
permissions:
  contents: read

# Avoid piling up redundant runs: a new push to the same PR/branch cancels the
# previous in-progress run. Pushes to main are never cancelled so every commit
# on the default branch is fully validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-and-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Rebuild specimen artifact
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-documentation
          path: |
            dist
            storybook-static
            etc/improve-design-system.api.md

  consumer-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vite, next]
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: node scripts/test-consumer-fixture.mjs --framework ${{ matrix.framework }} --react ${{ matrix.react }}

  react-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: node scripts/test-consumer-fixture.mjs --framework vite --react canary

  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
